[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "evoscope"
version = "0.9.2"
description = "A minimal regulatory spatial model for emergent multicellular organization"
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "pandas",
    "matplotlib",
    "torch",
    "scikit-learn"
]

[project.scripts]
evoscope = "evoscope.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["evoscope*"]
